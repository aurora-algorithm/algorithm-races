[package]
name = "kernels"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# "work" kernels (SPEC.md section 11); image with only its JPEG codec.
argon2 = "=0.6.0"
bcrypt = "=0.19.3"
csv = "=1.4.0"
fast_image_resize = { version = "=6.1.0", features = ["image"] }
flate2 = "=1.1.11"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = "=0.7.1"
zstd = "=0.14.4"
# "pi-digits" (SPEC.md section 13): Rust has no standard big integer.
num-bigint = "=0.5.1"
# "builtins" group (../builtins-NOTES.md): popular alternatives to the standard library's sort and hash map.
ahash = "=0.8.12"
hashbrown = "=0.17.1"
rayon = "=1.12.0"
rustc-hash = "=2.1.3"
# "bwords" jobs: the Aho-Corasick crate the regex crate builds on.
aho-corasick = "=1.1.5"
voracious_radix_sort = { version = "=1.2.2", features = ["voracious_multithread"] }

[workspace]
